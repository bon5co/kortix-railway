name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [db, auth, rest, storage, kong, api, gateway, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: kortix ${{ matrix.role }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.role }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/bon5co/kortix-railway-${{ matrix.role }}:0.16.4
            ghcr.io/bon5co/kortix-railway-${{ matrix.role }}:latest
